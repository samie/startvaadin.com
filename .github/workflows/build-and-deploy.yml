# Deployment is a jar deployment done outside CI (see "Jar deployment" in README.adoc).
# This workflow only verifies that main still builds the self-contained production jar.
name: Build
permissions:
  contents: read
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  START_SPRING_IO_TMPDIR: /tmp/start-spring-io-cache-2024-12-11
jobs:
  build:
    name: Build production jar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.3.0
        with:
          java-version-file: '.sdkmanrc'
          cache: 'maven'

      - name: Cache Maven/Gradle repositories for tests
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.START_SPRING_IO_TMPDIR }}
          # See https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          key: test-repositories-${{ runner.os }}-${{ github.run_id }}
          restore-keys: test-repositories-${{ runner.os }}

      - name: Build with Maven
        run: ./mvnw --batch-mode --update-snapshots -Pproduction verify

      - name: Send notification
        uses: $/.github/actions/send-notification
        if: always()
        with:
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ job.status }}
          run-name: ${{ format('start.spring.io | {0}', github.ref_name) }}
